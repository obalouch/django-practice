<h3>
    Add a comment
</h3>
<form action="{% url 'solo:CommentPost' post.id %}" method="POST">
    <div class="left">
        {{form.name.as_field_group}}
    </div>
    <div class="left">
        {{form.email.as_field_group}}
    </div>
    {{form.body.as_field_group}}
    {% csrf_token %}
    <p>
        <input type="submit" value="add comment">
    </p>
</form>
